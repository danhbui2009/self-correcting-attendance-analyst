[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "module2-attendance-analyst"
version = "0.1.0"
description = "Evidence-checking attendance analyst portfolio demo built with LangGraph"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langgraph==1.2.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]
ui = ["streamlit>=1.55,<2.0"]

[project.scripts]
module2-analyst = "attendance_analyst.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
